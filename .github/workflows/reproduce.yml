name: reproduce

on:
  push:
  pull_request:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Check secrets, paths and restricted files
        run: python analysis/tests/audit_repository.py
      - name: Parse analysis R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("analysis", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
          invisible(lapply(files, parse))
          cat("PASS:", length(files), "R files parsed\n")
      - name: Compile Python analysis scripts
        run: python -m py_compile analysis/scripts/*.py analysis/tests/*.py

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::data.table
            any::ggplot2
            any::patchwork
            any::scales
      - name: Reproduce figures and checks
        run: Rscript scripts/make_figures.R

  analysis-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::data.table
            any::MendelianRandomization
            any::coloc
            github::MRCIEU/TwoSampleMR@v0.7.9
            github::rondolab/MR-PRESSO@3e3c92d7eda6dce0d1d66077373ec0f7ff4f7e87
      - name: Run synthetic MR and colocalization smoke test
        run: Rscript analysis/tests/smoke_test.R
