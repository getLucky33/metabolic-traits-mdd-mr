name: reproduce

on:
  push:
  pull_request:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Check secrets, paths and restricted files
        run: python analysis/tests/audit_repository.py
      - name: Parse analysis R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("analysis", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
          invisible(lapply(files, parse))
          cat("PASS:", length(files), "R files parsed\n")
      - name: Compile Python analysis scripts
        run: python -m py_compile analysis/scripts/*.py analysis/tests/*.py
      - name: Test reverse-extractor duplicate-key guards
        run: python analysis/tests/test_reverse_extractor.py

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-renv@v2
      - name: Reproduce figures and checks
        run: Rscript scripts/make_figures.R --out results/figures
      - name: Confirm figure source tables and checksums
        run: |
          test -s results/figures/Figure_2_plot_data.tsv
          test -s results/figures/Figure_3_matrix_data.tsv
          test -s results/figures/Figure_4_plot_data.tsv
          test -s results/figures/figure_checksums.tsv
          test "$(tail -n +2 results/figures/Figure_2_plot_data.tsv | wc -l)" -eq 45
          test "$(tail -n +2 results/figures/Figure_4_plot_data.tsv | wc -l)" -eq 12
      - name: Confirm released aggregate inputs were not rewritten
        run: git diff --exit-code -- data/derived

  analysis-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-renv@v2
      - name: Run synthetic MR and colocalization smoke test
        run: Rscript analysis/tests/smoke_test.R
      - name: Replay frozen 6,434-row classification
        run: |
          Rscript analysis/scripts/08_classify_coloc.R \
            --locus-manifest data/derived/coloc_locus_manifest.tsv \
            --results data/derived/coloc_abf_results.tsv \
            --status data/derived/coloc_status.tsv \
            --lead-qc data/derived/coloc_lead_qc.tsv \
            --out-dir results/analysis/coloc-replay
