name: reproduce

on:
  push:
  pull_request:

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::data.table
            any::ggplot2
            any::patchwork
            any::scales
      - name: Reproduce figures and checks
        run: Rscript scripts/make_figures.R
